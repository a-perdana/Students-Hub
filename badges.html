<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trophy Room — Students Hub</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/brand/favicon-64.png">
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Lora:wght@600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="lobby.css">
  <script>(function(){try{if(localStorage.getItem("sh-theme")==="bloom"){document.documentElement.classList.add("theme-bloom");var l=document.createElement("link");l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&display=swap";document.head.appendChild(l);}}catch(e){}})();</script>
  <style>
    /* ═══ Trophy Room — 16 collectible badges (design: Stitch "Trophy Room") ═══ */
    .tr-page { max-width: 1120px; margin: 0 auto; padding: 24px 20px 90px; }
    .tr-hero { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; padding: 26px 28px; border-radius: 26px; position: relative; overflow: hidden;
      background: radial-gradient(420px 220px at 100% 0%, rgba(34,211,238,.28), transparent 65%), radial-gradient(420px 260px at 0% 100%, rgba(139,124,255,.38), transparent 65%), linear-gradient(135deg,#2a1f6b 0%,#1a1550 60%,#0e3a52 100%);
      border: 1px solid rgba(255,255,255,.16); color: #fff; box-shadow: 0 30px 60px -28px rgba(108,92,231,.75); }
    @media (max-width: 720px) { .tr-hero { grid-template-columns: 1fr; text-align: center; } }
    .tr-eyebrow { font-size: .72rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: #bfe9f5; }
    .tr-hero h1 { margin: 4px 0 6px; font-size: clamp(1.8rem, 3.6vw, 2.6rem); color: #fff; }
    .tr-hero p { margin: 0; color: rgba(255,255,255,.82); max-width: 34rem; }
    .tr-ring { position: relative; width: 150px; height: 150px; margin: 0 auto; }
    .tr-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .tr-ring .trk { fill: none; stroke: rgba(255,255,255,.16); stroke-width: 9; }
    .tr-ring .fil { fill: none; stroke: url(#trGrad); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); filter: drop-shadow(0 0 8px rgba(251,191,36,.7)); }
    .tr-ring .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .tr-ring .mid b { font-family: 'Outfit',sans-serif; font-size: 2.2rem; line-height: 1; }
    .tr-ring .mid span { font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #bfe9f5; margin-top: 4px; }

    .tr-legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 6px; align-items: center; }
    .tr-legend > b { font-size: .7rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-right: 4px; }
    .tr-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 99px; font-size: .74rem; font-weight: 800; border: 1.5px solid var(--rc); color: var(--rc); background: rgba(255,255,255,.04); }
    .tr-pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--rc); box-shadow: 0 0 8px var(--rc); }
    .r-common { --rc: #cd7f32; } .r-uncommon { --rc: #cbd5e1; } .r-rare { --rc: #fbbf24; } .r-legendary { --rc: #22d3ee; }

    .tr-feature { display: flex; align-items: center; gap: 20px; margin: 16px 0; padding: 18px 22px; border-radius: 22px; border: 2px solid var(--rc); position: relative;
      background: linear-gradient(135deg, rgba(251,191,36,.14), rgba(139,124,255,.12)); box-shadow: 0 0 40px -14px var(--rc); }
    @media (max-width: 560px) { .tr-feature { flex-direction: column; text-align: center; } }
    .tr-feature .flag { position: absolute; top: -11px; left: 22px; padding: 3px 12px; border-radius: 99px; font-size: .66rem; font-weight: 800; letter-spacing: .1em; background: #fbbf24; color: #3b2600; }
    .tr-feature img { width: 110px; height: 110px; flex-shrink: 0; filter: grayscale(.45) brightness(.8); }
    .tr-feature .tx { flex: 1; min-width: 0; width: 100%; }
    .tr-feature h2 { margin: 0 0 2px; font-size: 1.3rem; }
    .tr-feature .goal { color: var(--ink-2); font-size: .9rem; margin-bottom: 10px; }
    .tr-bar { height: 14px; border-radius: 99px; background: rgba(0,0,0,.3); border: 1px solid var(--border-2); overflow: hidden; }
    .tr-bar > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #8b7cff, #22d3ee 55%, #fbbf24); box-shadow: 0 0 14px rgba(34,211,238,.6); transition: width .9s cubic-bezier(.2,.8,.2,1); }
    .tr-feature .num { margin-top: 6px; font-size: .78rem; font-weight: 800; color: var(--rc); }

    .tr-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0 14px; }
    .tr-tab { padding: 8px 16px; border-radius: 99px; border: 1.5px solid var(--border-2); background: transparent; color: var(--ink-2); font: inherit; font-weight: 700; font-size: .85rem; cursor: pointer; }
    .tr-tab.is-active { background: linear-gradient(180deg,#9a8cff,#6c5ce7); color: #fff; border-color: #b9b0ff; box-shadow: 0 3px 0 #3f31a8; }
    .tr-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    @media (max-width: 960px) { .tr-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 700px) { .tr-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

    .tr-card { position: relative; text-align: center; padding: 16px 12px 14px; border-radius: 22px; border: 2px solid var(--border-2); background: var(--glass, var(--white)); }
    .tr-card .rar { position: absolute; top: 10px; left: 12px; font-size: .6rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--rc); }
    .tr-card .chk { position: absolute; top: 8px; right: 10px; width: 22px; height: 22px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: .75rem; font-weight: 800; background: #34d399; color: #053b2a; }
    .tr-card img { width: 112px; height: 112px; display: block; margin: 14px auto 8px; }
    .tr-card .nm { font-family: 'Outfit',sans-serif; font-weight: 800; font-size: 1rem; }
    .tr-card .goal { margin-top: 3px; font-size: .76rem; color: var(--ink-3); min-height: 2.2em; }
    .tr-card .mini { height: 6px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; margin-top: 8px; }
    .tr-card .mini > i { display: block; height: 100%; background: var(--rc); }
    .tr-card .st { margin-top: 6px; font-size: .72rem; font-weight: 800; color: var(--ink-3); }
    .tr-card.done { border-color: var(--rc); box-shadow: 0 0 28px -8px var(--rc); }
    .tr-card.done .chk { display: flex; }
    .tr-card.done .st { color: #34d399; }
    .tr-card.locked img { filter: grayscale(1) brightness(.42); }
    .tr-card.locked { border-style: dashed; }
    .tr-card.locked::after { content: '🔒'; position: absolute; top: 8px; right: 10px; font-size: .9rem; }
    .tr-card.is-new::before { content: 'NEW'; position: absolute; top: -9px; left: 50%; transform: translateX(-50%); padding: 2px 10px; border-radius: 99px; font-size: .62rem; font-weight: 800; background: #fbbf24; color: #3b2600; z-index: 2; }

    /* Bloom (light) adjustments */
    html.theme-bloom body.lobby .tr-hero h1 { color: #fff; }
    html.theme-bloom body.lobby .r-uncommon { --rc: #6b7a90; }
    html.theme-bloom body.lobby .r-common { --rc: #b4631f; }
    html.theme-bloom body.lobby .r-rare { --rc: #d99100; }
    html.theme-bloom body.lobby .r-legendary { --rc: #0e8fb0; }
    html.theme-bloom body.lobby .tr-bar, html.theme-bloom body.lobby .tr-card .mini { background: #eadff8; border-color: #d9c9f3; }
    html.theme-bloom body.lobby .tr-feature { background: linear-gradient(135deg, #fff4d6, #f3ecff); }
    html.theme-bloom body.lobby .tr-pill { background: #fff; }
  </style>
</head>
<body class="lobby" style="display:none">
  <!-- FIREBASE_ENV -->

  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="trGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient>
  </defs></svg>

  <div id="navbar-container"></div>

  <main class="tr-page">
    <section class="tr-hero" aria-label="Your badge progress">
      <div>
        <div class="tr-eyebrow">Your collection</div>
        <h1>Trophy Room</h1>
        <p>Sixteen badges to collect. Every one is earned by practising: points, streaks, perfect runs and levels. Bronze, silver, gold and diamond mark how rare they are.</p>
      </div>
      <div class="tr-ring" aria-label="Badges unlocked">
        <svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52"/><circle class="fil" id="trFill" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
        <div class="mid"><b id="trCount">0 / 16</b><span>unlocked</span></div>
      </div>
    </section>

    <div class="tr-legend" id="trLegend"><b>Rarity</b></div>

    <section id="trFeature" hidden></section>

    <div class="tr-tabs" id="trTabs" role="tablist">
      <button type="button" class="tr-tab is-active" data-cat="all" role="tab">All</button>
      <button type="button" class="tr-tab" data-cat="progress" role="tab">Progress</button>
      <button type="button" class="tr-tab" data-cat="streak" role="tab">Streak</button>
      <button type="button" class="tr-tab" data-cat="skill" role="tab">Skill</button>
      <button type="button" class="tr-tab" data-cat="honor" role="tab">Honour</button>
    </div>
    <div class="tr-grid" id="trGrid"></div>
  </main>

  <script type="module" src="auth-guard.js"></script>
  <script src="./partials/feedback-fx.js"></script>
  <script src="./partials/badges.js"></script>
  <script type="module">
    import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    fetch('/partials/navbar.html').then(r => r.text()).then(html => {
      document.getElementById('navbar-container').innerHTML = html;
      document.querySelectorAll('#navbar-container script').forEach(old => {
        const s = document.createElement('script');
        s.textContent = old.textContent;
        old.replaceWith(s);
      });
    });

    const B = window.SH_BADGES;
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
    let all = [], cat = 'all', fresh = [];

    window.addEventListener('authReady', async (ev) => {
      if (!ev.detail.signedIn) return;
      const uid = window.currentUser.uid;
      let d = {};
      try {
        const snap = await getDoc(doc(window.db, 'student_points', uid));
        d = snap.exists() ? snap.data() : {};
      } catch (e) { console.warn('[trophies] points load failed', e.message); }
      all = B.status(d);
      fresh = B.checkNew(uid, d);          // badges unlocked since the last visit anywhere in the portal
      renderLegend(); renderRing(); renderFeature(); renderGrid();
      document.querySelectorAll('#trTabs .tr-tab').forEach(b => b.addEventListener('click', () => {
        cat = b.dataset.cat;
        document.querySelectorAll('#trTabs .tr-tab').forEach(x => x.classList.toggle('is-active', x === b));
        renderGrid();
      }));
      if (fresh.length) setTimeout(() => B.celebrate(fresh), 500);
    });

    function renderLegend() {
      const box = document.getElementById('trLegend');
      Object.keys(B.rarity).forEach(k => {
        const r = B.rarity[k];
        box.insertAdjacentHTML('beforeend', '<span class="tr-pill r-' + k + '"><i></i>' + r.label + '</span>');
      });
    }
    function renderRing() {
      const n = all.filter(b => b.done).length;
      document.getElementById('trCount').textContent = n + ' / ' + all.length;
      const C = 2 * Math.PI * 52;
      document.getElementById('trFill').setAttribute('stroke-dashoffset', C * (1 - n / all.length));
    }
    function renderFeature() {
      const locked = all.filter(b => !b.done).sort((a, b) => b.pct - a.pct)[0];
      const box = document.getElementById('trFeature');
      if (!locked) {
        box.hidden = false;
        box.innerHTML = '<div class="tr-feature r-legendary"><div class="tx"><h2>Collection complete 🏆</h2><div class="goal">You earned every badge. Legend!</div></div></div>';
        return;
      }
      box.hidden = false;
      box.innerHTML = '<div class="tr-feature r-' + locked.rar + '"><span class="flag">ALMOST THERE!</span>'
        + '<img src="' + B.art(locked.id) + '" alt="">'
        + '<div class="tx"><h2>' + esc(locked.name) + '</h2><div class="goal">' + esc(locked.goal) + '</div>'
        + '<div class="tr-bar"><i style="width:' + Math.max(3, locked.pct) + '%"></i></div>'
        + '<div class="num">' + locked.cur.toLocaleString('en-GB') + ' / ' + locked.n.toLocaleString('en-GB') + ' · ' + locked.pct + '%</div></div></div>';
    }
    function renderGrid() {
      const freshIds = new Set(fresh.map(b => b.id));
      const list = all.filter(b => cat === 'all' || b.cat === cat);
      document.getElementById('trGrid').innerHTML = list.map(b => {
        const r = B.rarity[b.rar];
        return '<div class="tr-card r-' + b.rar + (b.done ? ' done' : ' locked') + (freshIds.has(b.id) ? ' is-new' : '') + '">'
          + '<span class="rar">' + r.label + '</span><span class="chk" aria-hidden="true">✓</span>'
          + '<img src="' + B.art(b.id) + '" alt="" loading="lazy">'
          + '<div class="nm">' + esc(b.name) + '</div><div class="goal">' + esc(b.goal) + '</div>'
          + (b.done ? '<div class="st">Unlocked</div>' : '<div class="mini"><i style="width:' + b.pct + '%"></i></div><div class="st">' + b.cur.toLocaleString('en-GB') + ' / ' + b.n.toLocaleString('en-GB') + '</div>')
          + '</div>';
      }).join('');
    }
  </script>
  <script src="./partials/footer.js"></script>
</body>
</html>
