<!--
  partials/navbar.html — Students Hub topbar.
  Loaded by every authenticated page (NOT login / class-picker /
  waiting / shared which need a clean header).

  No dropdowns, no admin tooling — Students Hub deliberately keeps
  the chrome minimal because the audience is 12-18 year-old students
  on phones.
-->
<header class="topbar">
  <a href="/" class="topbar-brand">
    <img class="brand-mark-img" src="/assets/brand/students-hub-mark.webp" alt="" width="34" height="34">
    <span>Students Hub</span>
  </a>
  <nav class="topbar-nav" id="topbarNav">
    <a href="/" data-nav="dashboard">Dashboard</a>
    <!-- Tests + Growth links hidden 2026-10-02: Students Hub is practice +
         points for Grade 7-12. The /tests, /test, /ease-test, /growth pages
         still exist (reachable by URL) and can be re-linked here later.
         Handbook link removed the same day (Alif: not needed); /handbook
         still renders the Drive documents if opened directly. -->
    <a href="/practice" data-nav="practice">Practice</a>
    <a href="/daily-challenge" data-nav="daily-challenge">Daily</a>
    <a href="/leaderboard" data-nav="leaderboard">Leaderboard</a>
    <a href="/badges" data-nav="badges">Trophies</a>
    <a href="/profile" data-nav="profile">Profile</a>
  </nav>
  <div class="topbar-user">
    <span class="points-chip" id="topbarPoints" style="display:none">
      <span class="icon">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12 2l2.39 7.36H22l-6.18 4.5L18.21 21 12 16.5 5.79 21l2.39-7.14L2 9.36h7.61L12 2z"/></svg>
      </span>
      <span id="topbarPointsVal">0</span>
    </span>
    <button type="button" class="theme-toggle-btn" id="themeToggleBtn" title="Choose your look" aria-label="Choose your look">🌸</button>
    <button type="button" class="fx-mute-btn" id="fxMuteBtn" title="Toggle sound" aria-label="Toggle sound">🔊</button>
    <a href="/avatar" class="topbar-avatar" id="topbarAvatar" title="Open Character Studio">·</a>
  </div>
</header>
<script>
  // Highlight active nav link based on current path.
  (function () {
    const path = (window.location.pathname.replace(/\/$/, '') || '/');
    const map  = {
      '/': 'dashboard', '/tests': 'tests', '/growth': 'growth',
      '/leaderboard': 'leaderboard', '/badges': 'badges', '/profile': 'profile',
      '/practice': 'practice', '/daily-challenge': 'daily-challenge'
    };
    let activeKey = map[path] || null;
    if (!activeKey) {
      if (path.startsWith('/practice-run')) activeKey = 'practice';
      else if (path.startsWith('/test'))    activeKey = 'tests';
    }
    if (activeKey) {
      const link = document.querySelector('#topbarNav a[data-nav="' + activeKey + '"]');
      if (link) {
        link.classList.add('active');
        // Phone layout scrolls the nav sideways — keep the current page in view.
        if (window.matchMedia('(max-width: 760px)').matches) {
          link.scrollIntoView({ block: 'nearest', inline: 'center' });
        }
      }
    }

    function paintAvatar() {
      const av = document.getElementById('topbarAvatar');
      if (!av) return;
      const p = window.studentProfile;
      const uid = window.currentUser && window.currentUser.uid;
      if (!p || !uid) return;
      const url = window.studentAvatarUrl ? window.studentAvatarUrl(uid, { size: 64 }) : '';
      if (url) {
        av.innerHTML = '<img src="' + url + '" alt="" loading="lazy">';
      } else {
        av.textContent = (p.displayName || p.email || '?').charAt(0).toUpperCase();
      }
    }

    // Best-effort points chip — fails silent if student_points doc absent.
    // Imports the modular SDK on demand because navbar runs in classic-script
    // context (no top-level import). Dynamic import() is supported on all
    // modern browsers (Chrome 63+, Safari 11.1+).
    async function paintPoints() {
      if (!window.db || !window.currentUser) return;
      try {
        const { doc, getDoc } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
        const snap = await getDoc(doc(window.db, 'student_points', window.currentUser.uid));
        if (!snap.exists()) return;
        const pts = snap.data().totalPoints || 0;
        const chip = document.getElementById('topbarPoints');
        const val  = document.getElementById('topbarPointsVal');
        if (val) val.textContent = pts.toLocaleString('en-GB');
        if (chip) chip.style.display = 'inline-flex';
      } catch (e) { /* silent — chip stays hidden */ }
    }

    function paintTester() {
      if (document.getElementById('shTesterChip') || !window.shIsTester || !window.shIsTester()) return;
      const u = document.querySelector('.topbar-user');
      if (!u) return;
      const c = document.createElement('a');
      c.id = 'shTesterChip'; c.href = '/avatar'; c.textContent = '🧪 TESTER';
      c.title = 'Eduversal tester mode: everything unlocked. Click to change.';
      c.style.cssText = 'padding:4px 10px;border-radius:99px;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-decoration:none;background:#fbbf24;color:#3b2600;white-space:nowrap';
      u.insertBefore(c, u.firstChild);
    }
    function onReady() { paintAvatar(); paintPoints(); paintTester(); }
    window.addEventListener('mascot-level', paintAvatar);
    if (window.studentProfile) onReady();
    else window.addEventListener('authReady', onReady);

    // Mute toggle — relies on partials/feedback-fx.js global.
    // The button paints initial state from fx.muted; flipping the
    // state plays a tick sound (only audible if unmuting). Document
    // event 'fx-mute-changed' keeps multiple open tabs in sync.
    function paintMuteBtn() {
      const btn = document.getElementById('fxMuteBtn');
      if (!btn) return;
      const isMuted = window.fx && window.fx.muted;
      btn.textContent = isMuted ? '🔇' : '🔊';
      btn.classList.toggle('is-muted', !!isMuted);
      btn.title = isMuted ? 'Sounds off — tap to enable' : 'Sounds on — tap to mute';
    }
    function wireMuteBtn() {
      const btn = document.getElementById('fxMuteBtn');
      if (!btn || btn._fxWired) return;
      btn._fxWired = true;
      btn.addEventListener('click', () => {
        if (!window.fx) return;
        const wasMuted = window.fx.muted;
        window.fx.toggleMute();
        paintMuteBtn();
        // Play a tick on UNMUTE so the student hears the change
        if (wasMuted && !window.fx.muted) window.fx.play('tick');
      });
      paintMuteBtn();
    }
    // fx may load slightly after navbar injection — try now, retry once
    wireMuteBtn();
    if (!(window.fx)) setTimeout(wireMuteBtn, 200);
    document.addEventListener('fx-mute-changed', paintMuteBtn);

    // Look switcher: Arcade (dark, default) -> Bloom (light, playful) -> Pro (calm, for teachers /
    // testers) -> Arcade. Per device in localStorage 'sh-theme' ('arcade' | 'bloom' | 'pro'); pages
    // apply it before paint from a tiny head script. Pro = html.theme-bloom + html.theme-pro.
    var LOOKS = [
      { id: 'arcade', icon: '🎮', name: 'Arcade (dark game look)' },
      { id: 'bloom',  icon: '🌸', name: 'Bloom (light, playful look)' },
      { id: 'pro',    icon: '💼', name: 'Pro (calm, professional look)' }
    ];
    function currentLook() {
      var c = document.documentElement.classList;
      return c.contains('theme-pro') ? 'pro' : c.contains('theme-bloom') ? 'bloom' : 'arcade';
    }
    function nextLook(id) { for (var i = 0; i < LOOKS.length; i++) if (LOOKS[i].id === id) return LOOKS[(i + 1) % LOOKS.length]; return LOOKS[0]; }
    function paintThemeBtn() {
      var btn = document.getElementById('themeToggleBtn');
      if (!btn) return;
      var cur = currentLook();
      var l = LOOKS.filter(function (x) { return x.id === cur; })[0];
      btn.textContent = l.icon;
      btn.title = 'Look: ' + l.name + ' — click to change';
      btn.setAttribute('aria-haspopup', 'menu');
    }
    function applyLook(id) {
      var c = document.documentElement.classList;
      c.toggle('theme-bloom', id !== 'arcade');
      c.toggle('theme-pro', id === 'pro');
      try { localStorage.setItem('sh-theme', id); } catch (e) {}
      if (id === 'bloom' && !document.getElementById('bloomFont')) {
        var l = document.createElement('link'); l.id = 'bloomFont'; l.rel = 'stylesheet';
        l.href = 'https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&display=swap';
        document.head.appendChild(l);
      }
    }
    function closeLookMenu() { var m = document.getElementById('lookMenu'); if (m) m.remove(); }
    function openLookMenu(anchor) {
      closeLookMenu();
      var cur = currentLook();
      var m = document.createElement('div');
      m.id = 'lookMenu'; m.setAttribute('role', 'menu');
      m.style.cssText = 'position:fixed;z-index:200;min-width:230px;padding:6px;border-radius:14px;background:#1a1545;color:#f1ecff;border:1px solid rgba(255,255,255,.2);box-shadow:0 18px 40px rgba(0,0,0,.45);font:600 .86rem DM Sans,sans-serif';
      var html = '<div style="padding:6px 10px 4px;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;opacity:.65;font-weight:800">Choose your look</div>';
      LOOKS.forEach(function (l) {
        var sel = l.id === cur;
        html += '<button type="button" role="menuitemradio" aria-checked="' + sel + '" data-look="' + l.id + '" style="display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:10px;cursor:pointer;text-align:left;font:inherit;color:inherit;background:' + (sel ? 'rgba(139,124,255,.35)' : 'transparent') + '">'
          + '<span style="font-size:1.15rem">' + l.icon + '</span><span style="flex:1">' + l.name + '</span>' + (sel ? '<span aria-hidden="true">✓</span>' : '') + '</button>';
      });
      m.innerHTML = html;
      document.body.appendChild(m);
      var r = anchor.getBoundingClientRect();
      m.style.top = (r.bottom + 8) + 'px';
      m.style.left = Math.max(8, Math.min(window.innerWidth - m.offsetWidth - 8, r.right - m.offsetWidth)) + 'px';
      m.querySelectorAll('button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          applyLook(btn.getAttribute('data-look'));
          paintThemeBtn(); closeLookMenu();
          if (window.fx && window.fx.play) window.fx.play('tick');
        });
      });
      setTimeout(function () {
        document.addEventListener('click', function off(e) { if (!m.contains(e.target) && e.target !== anchor) { closeLookMenu(); document.removeEventListener('click', off); } });
      }, 0);
    }
    var tb = document.getElementById('themeToggleBtn');
    if (tb && !tb._wired) {
      tb._wired = true;
      tb.addEventListener('click', function () { if (document.getElementById('lookMenu')) closeLookMenu(); else openLookMenu(tb); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLookMenu(); });
      paintThemeBtn();
    }
  })();
</script>
