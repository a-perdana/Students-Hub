<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pick your grade — Students Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Lora:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="lobby.css">
  <style>
    body { background: var(--paper); min-height: 100vh; }
    .picker-shell {
      max-width: 560px; margin: 0 auto;
      padding: 36px 20px 80px;
    }
    .picker-head { text-align: center; margin-bottom: 28px; }
    .picker-head h1 { margin-bottom: 8px; }
    .picker-head p  { color: var(--ink-3); }
    .school-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
      background: var(--cyan-2); border: 1px solid #b8e8f0;
      border-radius: 10px; margin-bottom: 24px;
      font-size: 0.92rem;
    }
    .school-row strong { color: var(--cyan-dk); }
    .pick-grid { display: grid; gap: 10px; }
    .grade-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .grade-grid .pick-row { flex-direction: column; justify-content: center; gap: 2px; padding: 16px 8px; text-align: center; }
    .grade-num { font-family: 'Lora', serif; font-size: 1.6rem; font-weight: 600; color: var(--ink); line-height: 1.1; }
    .grade-lbl { font-size: 0.78rem; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
    .lock-note { margin-top: 14px; font-size: 0.84rem; color: var(--ink-3); text-align: center; }
    @media (max-width: 380px) { .grade-grid { grid-template-columns: repeat(2, 1fr); } }
    .pick-row {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px;
      background: var(--white); border: 1.5px solid var(--border);
      border-radius: 12px; cursor: pointer;
      transition: all .15s;
    }
    .pick-row:hover    { border-color: var(--mor); background: var(--mor-2); }
    .pick-row.selected { border-color: var(--mor); background: var(--mor-2); }
    .pick-name   { flex: 1; font-weight: 500; }
    .pick-grade  { font-size: 0.84rem; color: var(--ink-3); }
    .err { margin-top: 14px; padding: 10px 14px; border-radius: 10px;
           background: var(--danger-bg); color: var(--danger);
           font-size: 0.86rem; border: 1px solid #fca5a5; }
    .actions { margin-top: 24px; display: flex; gap: 12px; }
    .signout-link {
      display: block; text-align: center; margin-top: 18px;
      font-size: 0.84rem; color: var(--ink-3);
    }
  </style>
</head>
<body class="lobby" style="display:none">
  <!-- FIREBASE_ENV -->

  <main class="picker-shell">
    <div class="picker-head">
      <h1>Welcome to Students Hub</h1>
      <p>Tell us your grade. We will show you practice questions for your grade.</p>
    </div>

    <div id="schoolRow" class="school-row" hidden></div>

    <!-- Shared domain (two schools use one email domain): school first, then grade -->
    <div id="schoolStep" hidden>
      <h3 style="margin-bottom:12px">Which school?</h3>
      <div id="schoolList" class="pick-grid"></div>
    </div>

    <div id="gradeStep" hidden>
      <h3 style="margin-bottom:12px">Which grade are you in?</h3>
      <div id="gradeList" class="grade-grid"></div>
      <p class="lock-note">Choose carefully. You can't change your grade later. If it is wrong, ask your school or Eduversal to fix it.</p>
      <div id="errBox" class="err" hidden></div>
      <div class="actions">
        <button id="confirmBtn" class="btn btn-primary btn-block btn-lg" disabled>Confirm</button>
      </div>
    </div>

    <div id="loadState" class="empty">Loading…</div>

    <a href="#" id="signOutLink" class="signout-link">Not you? Sign out</a>
  </main>

  <script type="module" src="auth-guard.js"></script>
  <script type="module">
    import {
      doc, updateDoc, serverTimestamp,
      collection, query, where, getDocs
    } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    document.getElementById('signOutLink').addEventListener('click', e => {
      e.preventDefault(); window.signOutStudent();
    });

    // Students Hub is open to Grade 7-12 (2026-10-02). There are no
    // classes and no teacher approval: the school comes from the email
    // domain, the student picks a grade once, and the account is active.
    // The Firestore rule re-checks the school against the email domain
    // and locks the grade afterwards (only an admin can change it).
    const GRADES = [7, 8, 9, 10, 11, 12];

    let chosenSchoolId = null;
    let chosenSchoolNm = null;
    let chosenGrade    = null;

    window.addEventListener('authReady', async (ev) => {
      if (!ev.detail.signedIn) { window.location.href = '/login'; return; }
      const profile = window.studentProfile;
      if (profile.is_hq_observer === true) {
        // Eduversal staff: preview any grade; no school step, not locked.
        document.querySelector('.picker-head h1').textContent = 'Preview Students Hub';
        document.querySelector('.picker-head p').textContent =
          'You are signed in with an Eduversal account. Choose the grade you want to see. You can change it any time from your profile.';
        document.querySelector('.lock-note').textContent =
          'Eduversal staff can switch grade whenever they like. Students choose once.';
        chosenSchoolId = profile.schoolId || 'eduversal_hq';
        chosenSchoolNm = profile.school || 'Eduversal HQ';
        showSchoolBanner();
        showGrades();
        if (profile.gradeLevel) {
          const cur = [...document.querySelectorAll('#gradeList .pick-row')]
            .find(r => r.querySelector('.grade-num').textContent === String(profile.gradeLevel));
          if (cur) cur.click();
        }
        return;
      }
      if (profile.schoolId) {
        chosenSchoolId = profile.schoolId;
        chosenSchoolNm = profile.school || '';
        showSchoolBanner();
        showGrades();
      } else {
        await loadSchoolPicker();
      }
    });

    function showSchoolBanner() {
      const row = document.getElementById('schoolRow');
      row.innerHTML = 'School: <strong>' + escapeHtml(chosenSchoolNm) + '</strong>';
      row.hidden = false;
    }

    function makeChoice(row, onChoose) {
      row.tabIndex = 0;
      row.setAttribute('role', 'button');
      row.addEventListener('click', onChoose);
      row.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onChoose(); }
      });
    }

    async function loadSchoolPicker() {
      const dom = (window.studentProfile.emailLower || '').split('@')[1];
      if (!dom) return;
      const q = await getDocs(query(
        collection(window.db, 'partner_schools'),
        where('domain', '==', dom)
      ));
      const list = document.getElementById('schoolList');
      list.innerHTML = '';
      q.forEach(d => {
        const data = d.data();
        const row = document.createElement('div');
        row.className = 'pick-row';
        row.innerHTML = '<span class="pick-name">' + escapeHtml(data.name || d.id) + '</span>';
        makeChoice(row, () => {
          chosenSchoolId = d.id;
          chosenSchoolNm = data.name || d.id;
          showSchoolBanner();
          document.getElementById('schoolStep').hidden = true;
          showGrades();
        });
        list.appendChild(row);
      });
      document.getElementById('loadState').hidden = true;
      document.getElementById('schoolStep').hidden = false;
    }

    function showGrades() {
      const list = document.getElementById('gradeList');
      list.innerHTML = '';
      GRADES.forEach(g => {
        const row = document.createElement('div');
        row.className = 'pick-row';
        row.innerHTML = '<span class="grade-lbl">Grade</span><span class="grade-num">' + g + '</span>';
        makeChoice(row, () => {
          [...list.querySelectorAll('.pick-row')].forEach(r => r.classList.remove('selected'));
          row.classList.add('selected');
          chosenGrade = g;
          const btn = document.getElementById('confirmBtn');
          btn.disabled = false;
          btn.textContent = 'Confirm — Grade ' + g;
        });
        list.appendChild(row);
      });
      document.getElementById('loadState').hidden = true;
      document.getElementById('gradeStep').hidden = false;
    }

    document.getElementById('confirmBtn').addEventListener('click', async () => {
      if (!chosenGrade || !chosenSchoolId) return;
      const btn = document.getElementById('confirmBtn');
      const err = document.getElementById('errBox');
      btn.disabled = true; btn.textContent = 'Saving…'; err.hidden = true;
      try {
        if (window.studentProfile.is_hq_observer === true) {
          // Rule branch "HQ observer grade preview": only these two keys.
          await updateDoc(doc(window.db, 'students', window.currentUser.uid), {
            gradeLevel: chosenGrade, gradePickedAt: serverTimestamp(),
          });
          window.location.href = '/practice';
          return;
        }
        await updateDoc(doc(window.db, 'students', window.currentUser.uid), {
          schoolId:      chosenSchoolId,
          school:        chosenSchoolNm,
          gradeLevel:    chosenGrade,
          status:        'active',
          gradePickedAt: serverTimestamp(),
        });
        window.location.href = '/welcome';
      } catch (e) {
        err.textContent = 'Could not save: ' + (e.message || e.code);
        err.hidden = false;
        btn.disabled = false; btn.textContent = 'Confirm — Grade ' + chosenGrade;
      }
    });

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      })[c]);
    }
  </script>
</body>
</html>
